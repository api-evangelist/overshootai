aid: overshootai
name: overshoot.ai
description: >-
  Overshoot is real-time AI vision infrastructure. It ingests live video streams
  over WebRTC (LiveKit) and lets developers query those frames with vision-language
  models through an OpenAI-compatible chat completions API, returning structured
  results such as bounding boxes, pixel coordinates, OCR text, and JSON in as little
  as 200ms. The REST API manages the full stream lifecycle (create, keepalive,
  inspect, delete), lists available VLMs from Overshoot, Anthropic, Google, and
  OpenAI, and handles prepaid credit billing. Overshoot is a Y Combinator and a16z
  portfolio company building the vision layer for accessibility, security monitoring,
  sports analysis, robotics, retail analytics, and structured data extraction from
  live video.
